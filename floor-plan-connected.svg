<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="900" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="600" y="30" font-size="28" font-weight="bold" text-anchor="middle" fill="#333">
    Architectural Floor Plan - Connected Layout
  </text>
  
  <!-- Grid for reference -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#grid)" />
  
  <!-- Rectangle 1: 1.250 x 6.100 (horozontal, top left side) -->
  <g id="room1">
    <rect x="150" y="150" width="610" height="125" fill="#e8f4f8" stroke="#333" stroke-width="3"/>
    <text x="212.5" y="460" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      <tspan x="212.5" dy="0">1.25m</tspan>
      <tspan x="212.5" dy="18">×</tspan>
      <tspan x="212.5" dy="18">6.10m</tspan>
    </text>
    <text x="212.5" y="790" font-size="12" text-anchor="middle" fill="#666" font-weight="bold">Room 1</text>
  </g>
  
  <!-- Rectangle 2: 3.750 x 3.500 (90° rotation, 3.750 side joins bottom right of Room 2) -->
  <!-- Position: starts at x=275 (150+125), y=610 (150+610-offset), extends right with width 3.500m = 350px, height 3.750m = 375px -->
  <g id="room2">
    <rect x="275" y="385" width="350" height="375" fill="#f0e8f4" stroke="#333" stroke-width="3"/>
    <text x="450" y="575" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      <tspan x="450" dy="0">3.75m</tspan>
      <tspan x="450" dy="18">×</tspan>
      <tspan x="450" dy="18">3.50m</tspan>
    </text>
    <text x="450" y="785" font-size="12" text-anchor="middle" fill="#666" font-weight="bold">Room 2</text>
  </g>
  
  <!-- Rectangle 3: 2.500 x 2.500 (Parallel with Room 1, on the bottom right side of Room 2) -->
  <!-- Position: starts at x=625 (275+350), parallel orientation (vertical) like Room 1 -->
  <g id="room3">
    <rect x="625" y="385" width="250" height="250" fill="#f4f0e8" stroke="#333" stroke-width="3"/>
    <text x="687.5" y="510" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">
      <tspan x="687.5" dy="0">2.50m</tspan>
      <tspan x="687.5" dy="18">×</tspan>
      <tspan x="687.5" dy="18">2.50m</tspan>
    </text>
    <text x="687.5" y="665" font-size="12" text-anchor="middle" fill="#666" font-weight="bold">Room 3</text>
  </g>
  
  <!-- Connection indicators -->
  <g stroke="#ff6b6b" stroke-width="2" stroke-dasharray="3,3" opacity="0.6">
    <!-- Connection from Room 1 to Room 2 (3.75m side) -->
    <line x1="275" y1="760" x2="275" y2="760" stroke="none"/>
    <!-- Connection from Room 2 to Room 3 (right edge) -->
    <line x1="625" y1="385" x2="625" y2="635" stroke="none"/>
  </g>
  
  <!-- Dimension annotations -->
  <g font-size="11" fill="#666" font-family="Arial, sans-serif">
    <!-- Room 1 dimensions -->
    <text x="120" y="160">6.10m</text>
    <text x="145" y="145">1.25m</text>
    
    <!-- Room 2 dimensions (rotated 90°) -->
    <text x="285" y="375">3.75m</text>
    <text x="630" y="395">3.50m</text>
    
    <!-- Room 3 dimensions -->
    <text x="590" y="395">2.50m</text>
    <text x="770" y="510">2.50m</text>
  </g>
  
  <!-- Connection notes -->
  <g font-size="11" fill="#c92a2a" font-weight="bold">
    <text x="275" y="775">← 3.75m joins here</text>
    <text x="625" y="370">Parallel ↑</text>
  </g>
  
  <!-- Overall dimensions -->
  <g font-size="10" fill="#333" font-family="Arial, sans-serif" font-weight="bold">
    <text x="100" y="820">Total Width: 7.50m (1.25 + 3.50 + 2.50)</text>
    <text x="100" y="835">Total Height: 6.10m</text>
  </g>
  
  <!-- Legend -->
  <g id="legend" transform="translate(50, 850)">
    <rect width="1100" height="40" fill="#fff" stroke="#999" stroke-width="1" rx="5"/>
    <text x="15" y="25" font-size="12" fill="#333">
      <tspan font-weight="bold">Layout:</tspan> Room 1 (vertical) | Room 2 (90° rotation, 3.75m side joins Room 1) | Room 3 (parallel vertical, right side)
    </text>
  </g>
</svg>
