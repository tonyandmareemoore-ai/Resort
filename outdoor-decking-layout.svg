<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Title and Legend -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    Outdoor Decking Layout - Z Pattern
  </text>
  <text x="400" y="55" font-size="14" text-anchor="middle" fill="#666">
    Board Dimensions: 0.140m × 5.4m | Total Area: 29 m²
  </text>
  
  <!-- Legend -->
  <g id="legend">
    <rect x="20" y="70" width="280" height="100" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
    <text x="30" y="90" font-size="12" font-weight="bold" fill="#333">Legend:</text>
    
    <!-- First Z segment -->
    <rect x="30" y="100" width="60" height="8" fill="#8B4513" stroke="#333" stroke-width="1"/>
    <text x="100" y="108" font-size="11" fill="#333">First Z segment (↘)</text>
    
    <!-- Second Z segment -->
    <rect x="30" y="120" width="60" height="8" fill="#A0522D" stroke="#333" stroke-width="1"/>
    <text x="100" y="128" font-size="11" fill="#333">Second Z segment (↗)</text>
    
    <!-- Third Z segment -->
    <rect x="30" y="140" width="60" height="8" fill="#CD853F" stroke="#333" stroke-width="1"/>
    <text x="100" y="148" font-size="11" fill="#333">Third Z segment (↘)</text>
  </g>
  
  <!-- Decking Area Background -->
  <rect x="100" y="200" width="600" height="350" fill="#E8D7C3" stroke="#333" stroke-width="2"/>
  
  <!-- Dimension annotations -->
  <text x="100" y="185" font-size="11" fill="#666">5.4m</text>
  <text x="60" y="380" font-size="11" fill="#666">29 m²</text>
  
  <!-- Z-Pattern Decking Boards -->
  <!-- First Z segment (diagonal from top-left to bottom-right) -->
  <g id="z-segment-1">
    <!-- Board 1 -->
    <rect x="120" y="220" width="360" height="14" fill="#8B4513" stroke="#333" stroke-width="1" transform="rotate(-35 300 227)"/>
    
    <!-- Board 2 -->
    <rect x="125" y="235" width="360" height="14" fill="#8B4513" stroke="#333" stroke-width="1" transform="rotate(-35 305 242)"/>
    
    <!-- Board 3 -->
    <rect x="130" y="250" width="360" height="14" fill="#8B4513" stroke="#333" stroke-width="1" transform="rotate(-35 310 257)"/>
    
    <!-- Board 4 -->
    <rect x="135" y="265" width="360" height="14" fill="#8B4513" stroke="#333" stroke-width="1" transform="rotate(-35 315 272)"/>
    
    <!-- Board 5 -->
    <rect x="140" y="280" width="360" height="14" fill="#8B4513" stroke="#333" stroke-width="1" transform="rotate(-35 320 287)"/>
  </g>
  
  <!-- Second Z segment (diagonal from bottom-left to top-right) -->
  <g id="z-segment-2">
    <!-- Board 6 -->
    <rect x="200" y="310" width="360" height="14" fill="#A0522D" stroke="#333" stroke-width="1" transform="rotate(35 380 317)"/>
    
    <!-- Board 7 -->
    <rect x="195" y="330" width="360" height="14" fill="#A0522D" stroke="#333" stroke-width="1" transform="rotate(35 375 337)"/>
    
    <!-- Board 8 -->
    <rect x="190" y="350" width="360" height="14" fill="#A0522D" stroke="#333" stroke-width="1" transform="rotate(35 370 357)"/>
    
    <!-- Board 9 -->
    <rect x="185" y="370" width="360" height="14" fill="#A0522D" stroke="#333" stroke-width="1" transform="rotate(35 365 377)"/>
  </g>
  
  <!-- Third Z segment (diagonal from top-left to bottom-right) -->
  <g id="z-segment-3">
    <!-- Board 10 -->
    <rect x="320" y="240" width="360" height="14" fill="#CD853F" stroke="#333" stroke-width="1" transform="rotate(-35 500 247)"/>
    
    <!-- Board 11 -->
    <rect x="325" y="255" width="360" height="14" fill="#CD853F" stroke="#333" stroke-width="1" transform="rotate(-35 505 262)"/>
    
    <!-- Board 12 -->
    <rect x="330" y="270" width="360" height="14" fill="#CD853F" stroke="#333" stroke-width="1" transform="rotate(-35 510 277)"/>
    
    <!-- Board 13 -->
    <rect x="335" y="285" width="360" height="14" fill="#CD853F" stroke="#333" stroke-width="1" transform="rotate(-35 515 292)"/>
    
    <!-- Board 14 -->
    <rect x="340" y="300" width="360" height="14" fill="#CD853F" stroke="#333" stroke-width="1" transform="rotate(-35 520 307)"/>
    
    <!-- Board 15 -->
    <rect x="345" y="315" width="360" height="14" fill="#CD853F" stroke="#333" stroke-width="1" transform="rotate(-35 525 322)"/>
  </g>
  
  <!-- Grid reference lines -->
  <line x1="100" y1="375" x2="700" y2="375" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <line x1="400" y1="200" x2="400" y2="550" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  
  <!-- Specifications Box -->
  <g id="specifications">
    <rect x="20" y="570" width="760" height="25" fill="#f0f0f0" stroke="#999" stroke-width="1"/>
    <text x="30" y="590" font-size="11" fill="#333">
      Total Boards: 15 | Board Length: 5.4m | Board Width: 0.140m | Spacing: Z-pattern (alternating 35° angles) | Total Area Coverage: 29 m²
    </text>
  </g>
</svg>